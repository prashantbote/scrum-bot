name: frontend

on:
  pull_request:
    paths: ["frontend/**", "backend/openapi.json"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.json"]

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API contract (fails if backend/openapi.json changed but the client wasn't regenerated)
        run: npm run gen:api -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E + accessibility (Playwright, MSW mock API)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
