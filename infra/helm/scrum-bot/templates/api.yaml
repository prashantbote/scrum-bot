apiVersion: apps/v1
kind: Deployment
metadata: { name: scrum-api, labels: { app: scrum-api } }
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: scrum-api } }
  template:
    metadata: { labels: { app: scrum-api } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/scrum-bot-api:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8800 }]
          {{- include "scrum.env" . | nindent 10 }}
          readinessProbe: { httpGet: { path: /readyz, port: 8800 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8800 }, periodSeconds: 20 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: scrum-api }
spec:
  selector: { app: scrum-api }
  ports: [{ port: 80, targetPort: 8800 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: scrum-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: scrum-api }
  minReplicas: {{ .Values.api.hpa.min }}
  maxReplicas: {{ .Values.api.hpa.max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.cpu }} } }
---
# Alembic runs as the owner role before every install/upgrade (plan §13 CD).
apiVersion: batch/v1
kind: Job
metadata:
  name: scrum-migrate-{{ .Release.Revision }}
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/scrum-bot-api:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          {{- include "scrum.env" . | nindent 10 }}
